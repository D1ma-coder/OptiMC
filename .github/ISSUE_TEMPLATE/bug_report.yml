name: Bug report
description: Report a reproducible client problem
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Commit, OS, GPU, server version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove credentials and private account or server information.
