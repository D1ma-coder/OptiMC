[package]
name = "optimc"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Independent Rust/Vulkan voxel client targeting Minecraft Java 26.2"
license = "MIT AND LGPL-3.0-or-later AND LicenseRef-tr7zw-Protective AND PolyForm-Shield-1.0.0 AND GPL-3.0-only"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
glam = { version = "0.29", features = ["bytemuck"] }
getrandom = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
md-5 = "0.10"
pollster = "0.4"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
wgpu = { version = "24", default-features = false, features = ["wgsl", "vulkan-portability"] }
winit = "0.30"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in"] }

# wgpu-hal 24 uses this feature to attach a CAMetalLayer to an AppKit window,
# including when the selected renderer is Vulkan through MoltenVK.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "24", default-features = false, features = ["metal"] }
objc2 = "0.5.3"
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["std", "NSData"] }
